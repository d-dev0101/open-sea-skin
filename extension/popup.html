<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0a0e14;
    --ink: #eef4f6;
    --accent: #8fe9e4;
    --dim: rgba(255, 255, 255, 0.55);
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.6 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .sub {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .row .label { font-size: 12px; }
  .row .desc {
    display: block;
    font-size: 10px;
    color: var(--dim);
    margin-top: 1px;
  }
  .switch {
    position: relative;
    flex: none;
    width: 34px;
    height: 20px;
  }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    transition: background 0.2s ease;
  }
  .track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #cfd8dc;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .track { background: rgba(143, 233, 228, 0.35); }
  .switch input:checked + .track::after {
    transform: translateX(14px);
    background: var(--accent);
    box-shadow: 0 0 8px rgba(143, 233, 228, 0.8);
  }
  .switch input:focus-visible + .track { outline: 2px solid rgba(143, 233, 228, 0.5); outline-offset: 2px; }
  .note {
    margin-top: 12px;
    padding: 9px 10px;
    border-radius: 8px;
    background: rgba(143, 233, 228, 0.07);
    border: 1px solid rgba(143, 233, 228, 0.2);
    font-size: 10.5px;
    color: var(--dim);
    line-height: 1.7;
  }
</style>
</head>
<body>
  <h1>OPEN SEA SKIN</h1>
  <div class="sub" data-i18n="tagline">Realtime WebGPU ocean · UI skin</div>

  <div class="row">
    <div class="label" id="skin-toggle-label">
      <span data-i18n="toggleLabel">Ocean background</span>
      <span class="desc" data-i18n="toggleDescription">DeepSeek Harness on 127.0.0.1 or localhost</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="skin-toggle" aria-labelledby="skin-toggle-label" />
      <span class="track"></span>
    </label>
  </div>

  <div class="note" data-i18n="note">New tabs use the full Open Sea scene. The Harness background pauses when its tab is hidden.</div>

  <script src="popup.js"></script>
</body>
</html>
