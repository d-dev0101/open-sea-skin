name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release whose verified package should be published
        required: true
        default: v1.2.7

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download and verify the existing GitHub package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node --input-type=module -e 'import { versionFromTag } from "./scripts/verify-release.mjs"; console.log(versionFromTag(process.env.RELEASE_TAG))')
          mkdir -p release-audit
          gh release download "$RELEASE_TAG" --pattern "open-sea-skin-$VERSION.tgz" --pattern SHA256SUMS --dir release-audit
          tar -xOf "release-audit/open-sea-skin-$VERSION.tgz" package/package.json > release-audit/package.json
          node scripts/verify-release.mjs --github "release-audit/open-sea-skin-$VERSION.tgz" release-audit/SHA256SUMS release-audit/package.json "$RELEASE_TAG"
          cp "release-audit/open-sea-skin-$VERSION.tgz" release-audit/open-sea-skin.tgz
      - name: Check whether npm already has these exact bytes
        id: registry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.mjs --registry release-audit/open-sea-skin.tgz "$RELEASE_TAG" release-audit --allow-missing
      - name: Publish the verified GitHub package only when the version is absent
        if: steps.registry.outputs.status == 'missing'
        run: |
          npm publish ./release-audit/open-sea-skin.tgz --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify newly published registry bytes
        if: steps.registry.outputs.status == 'missing'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.mjs --registry release-audit/open-sea-skin.tgz "$RELEASE_TAG" release-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integrity-evidence
          path: release-audit/
