name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose package version should be published
        required: true
        default: v1.2.5

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify release version
        run: test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
