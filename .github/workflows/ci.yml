name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OSS_CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:extension
      - name: Hosted Chrome
        run: google-chrome --version
      - name: Browser acceptance
        run: xvfb-run -a npm run test:browser
      - name: Website acceptance
        run: OSS_HEADLESS=1 npm run test:website
